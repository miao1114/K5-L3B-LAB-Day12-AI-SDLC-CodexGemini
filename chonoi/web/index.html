<!doctype html>
<html lang="vi" data-type="software">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#161c1a">
<meta name="page-type" content="software">
<meta name="site-kind" content="gaming">
<meta name="description" content="Theo chân Bà Út lặn bắt cá, hái rau buổi sáng và mở quán trên bè buổi tối.">
<meta property="og:title" content="Quán Ăn Chợ Nổi">
<meta property="og:description" content="Một ngày theo chân Bà Út, từ bến sông đến căn bếp trên bè.">
<meta property="og:image" content="/art/gather.webp">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23203b35'/%3E%3Cpath d='M5 20h22l-5 6H10zM15 5l-6 12h6zM18 8v9h6z' fill='%23e7ba56'/%3E%3C/svg%3E">
<title>Quán Ăn Chợ Nổi</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #161c1a;
    --surface: #1f2725;
    --ink: #f4ead4;
    --soft: #b9c8bc;
    --line: #46584e;
    --gold: #f1c77d;
    --paper: #f3e5c7;
    --paper-ink: #30281e;
    --paper-soft: #5d4c36;
    --paper-line: #cdbd9f;
    --title: Cambria, "Times New Roman", serif;
    font: 16px/1.45 system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; color: var(--ink); background: radial-gradient(ellipse at 50% 0, #2a3a33 0, var(--bg) 62%); }
  h1, h2, p { margin: 0; }
  h2 { font: 700 1.2rem/1.15 var(--title); }
  .shell { width: min(1280px, calc(100% - 64px)); margin: auto; padding: clamp(22px, 4vh, 44px) 0 28px; }
  .skip-link { position: absolute; left: 12px; top: 12px; z-index: 2; padding: 12px; color: var(--paper-ink); background: var(--paper); }
  .skip-link:not(:focus) { clip-path: inset(50%); }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { flex: none; width: 50px; height: 50px; }
  h1 { font: 700 clamp(1.7rem, 4vw, 3.25rem)/1.06 var(--title); letter-spacing: -.035em; }
  button {
    min-height: 44px; padding: 8px 16px;
    font: 650 .92rem/1.2 system-ui, sans-serif;
    color: #251a0d; background: var(--gold); border: 1px solid #f9d79c; border-radius: 6px;
    cursor: pointer; transition: background-color .16s, transform .16s;
  }
  @media (hover: hover) { button:hover { background: #ffda9b; transform: translateY(-1px); } }
  button:active { transform: translateY(1px); }
  button:disabled { cursor: wait; opacity: .65; }
  .game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(244px, 24%); align-items: start; gap: 16px; }
  .game[data-mode="gather"] { grid-template-columns: 218px minmax(0, 1fr) minmax(244px, 24%); }
  .quest { padding: 16px 12px; border: 1px solid #b99b66; border-radius: 9px;
    color: var(--paper-ink); background: var(--paper); font-size: 18px; min-width: 0; }
  .quest h2 { font: 700 18px/1.4 system-ui, sans-serif; text-transform: uppercase; }
  .quest ul { list-style: none; padding: 0; margin: 12px 0; }
  .quest li { padding: 8px 0; border-top: 1px solid var(--paper-line); }
  .quest-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .quest-row img { width: 26px; height: 26px; object-fit: contain; }
  .quest-row b { margin-left: auto; white-space: nowrap; }
  .quest progress { width: 100%; margin-top: 6px; height: 8px; --fill: #39704d; }
  .quest small { display: block; color: var(--paper-soft); font-size: 14px; }
  .quest .complete { color: #215d35; }
  #quest-status { font-size: 16px; }
  @media (max-width: 1100px) {
    .game[data-mode="gather"] { grid-template-columns: minmax(0, 1fr) minmax(244px, 24%); }
    .quest { grid-column: 1 / -1; }
    .quest ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  }
  .playfield, .ledger { min-width: 0; border-radius: 9px; overflow: hidden; }
  .playfield { border: 1px solid var(--line); background: var(--surface); }
  .hud { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; padding: 14px 18px; }
  .season, .metrics, .meter-line { display: flex; align-items: center; }
  .season { gap: 10px; }
  .season-mark {
    display: grid; place-items: center; flex: none; width: 38px; height: 38px;
    border: 1px solid #b48848; border-radius: 50%; color: var(--gold); background: #423524; font-size: 24px;
  }
  [data-mode="quan"] .season-mark { background: #263b42; border-color: #5f7a7d; color: #c7e0de; }
  .season p, .metric span { font-size: .83rem; color: var(--soft); }
  .metrics { flex-wrap: wrap; gap: 8px 16px; font-variant-numeric: tabular-nums; }
  .metric { border-left: 1px solid var(--line); padding-left: 12px; }
  .metric span { display: block; }
  .metric strong { font-size: 1rem; color: var(--ink); }
  .meter-line { gap: 7px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  progress {
    display: block; width: clamp(30px, 7vw, 82px); height: 6px; appearance: none;
    border: 0; border-radius: 4px; background: #4c5a50; --fill: #a4c9a1;
  }
  progress::-webkit-progress-bar { border-radius: 4px; background: #4c5a50; }
  progress::-webkit-progress-value { border-radius: 4px; background: var(--fill); }
  progress::-moz-progress-bar { border-radius: 4px; background: var(--fill); }
  .danger, .metric .danger { color: #ffc4a9; }
  .danger progress { --fill: #ef8d69; }
  .scene {
    position: relative; aspect-ratio: 1672 / 941; background: #29443b center / 100% 100%;
    box-shadow: inset 0 0 0 1px #1b261d66;
  }
  [data-mode="gather"] .scene { background-image: url("art/gather.webp"); }
  [data-mode="quan"] .scene { background-image: url("art/quan-nen.webp"); }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; background: #15241cc2; }
  .result {
    width: min(100%, 410px); padding: 14px; text-align: center;
    color: var(--paper-ink); background: var(--paper); border: 1px solid #b99b66; border-radius: 8px;
  }
  .result p { margin: 8px 0; }
  .result button { margin-top: 5px; }
  .status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; min-height: 42px; padding: 9px 18px; font-size: .88rem; }
  #hint { color: var(--gold); }
  #notice { color: var(--ink); }
  .keys {
    display: flex; flex-wrap: wrap; align-items: center; gap: 7px 14px;
    border-top: 1px solid var(--line); padding: 10px 18px; color: var(--soft); font-size: .82rem;
  }
  .keys > span { display: inline-flex; align-items: center; gap: 4px; }
  kbd {
    border: 1px solid #657467; border-radius: 4px; padding: 2px 5px;
    color: var(--ink); font: 700 .74rem/1.1 system-ui, sans-serif; background: #313b34;
  }
  .ledger { color: var(--paper-ink); background: var(--paper); color-scheme: light; border: 1px solid #d2b789; }
  .profile {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    padding: 10px 16px 0; min-height: 140px; gap: 8px;
    background: radial-gradient(circle at 76% 58%, #aeb79b 0 31%, transparent 31.5%), #d7d5b5;
  }
  .profile h2 { font-size: clamp(1.8rem, 3vw, 2.65rem); letter-spacing: -.04em; }
  .profile img { width: auto; height: 157px; max-width: 100%; object-fit: contain; align-self: end; }
  .tray { padding: 14px 16px; border-top: 1px solid var(--paper-line); }
  .slots { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; margin-top: 9px; }
  .slot { position: relative; }
  .stack-quantity { position: absolute; right: 0; bottom: 0; padding: 0 2px;
    background: var(--paper); color: var(--paper-ink); font: bold 13px/1.2 system-ui, sans-serif; }
  .slot {
    display: grid; place-items: center; aspect-ratio: 1; max-height: 40px;
    border: 1px solid #bba17b; border-radius: 4px; background: #e9d8b6; font-size: .75rem;
  }
  .slot.filled { background: #fff6e3; }
  .slot img, .stock img { display: block; width: 75%; height: 75%; object-fit: contain; }
  #hold-summary, .ticket, .stove, #hand { color: var(--paper-soft); font-size: .88rem; }
  #hold-summary { margin-top: 8px; }
  .stock h2, .orders h2 { margin-bottom: 6px; }
  .stock-row {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center;
    gap: 6px; padding-block: 3px; color: var(--paper-soft); font-size: .88rem;
  }
  .stock img { width: 21px; height: 17px; }
  .stock b, .ticket b, .stove b { color: var(--paper-ink); }
  .inventory-list, .flow .inventory-list { list-style: none; margin: 4px 0 0; padding: 0; }
  .inventory-list li {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px;
    align-items: baseline; padding-block: 4px; border-bottom: 1px solid var(--paper-line); font-size: .88rem;
  }
  .inventory-list small { display: block; color: var(--paper-soft); }
  .inventory-fresh { text-align: right; font-variant-numeric: tabular-nums; }
  .inventory-list .spoiled, .stock .spoiled b { color: #802512; }
  .slot.spoiled { border: 2px solid #a34d32; background: #f8d5c6; }
  .orders > * { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--paper-line); }
  /* Quán: đơn hàng/bếp/tay lên đầu; kho (độ tươi đổi liên tục) xuống cuối, cao cố định và cuộn riêng
     để danh sách đơn không bị đẩy hay nhảy khi số liệu kho cập nhật. */
  .tray { display: flex; flex-direction: column; }
  .tray > #orders { order: -1; }
  .tray > #stock:not([hidden]) {
    order: 1; margin-top: 12px; border-top: 1px solid var(--paper-line);
    max-height: 210px; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable;
  }
  .tray > #stock h2 { position: sticky; top: 0; z-index: 1; background: var(--paper); padding: 10px 0 4px; margin: 0; }
  .ticket, .stove { font-variant-numeric: tabular-nums; }
  .ticket + .ticket, .stove + .stove { margin-top: 5px; }
  .ticket .meter-line { display: flex; margin-top: 3px; }
  .ticket .danger { color: #942f19; }
  .ticket progress { background: #6f6049; --fill: #b7cc93; }
  .ticket progress::-webkit-progress-bar { background: #6f6049; }
  .ticket .danger progress { --fill: #ee9368; }
  @media (max-width: 940px) {
    .shell { width: calc(100% - 36px); }
    .game { grid-template-columns: minmax(0, 1fr); }
    .game[data-mode="gather"] { grid-template-columns: minmax(0, 1fr); }
    .ledger { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
    .tray { border-top: 0; border-left: 1px solid var(--paper-line); }
    .slots { max-width: 280px; }
  }
  @media (max-width: 540px) {
    .shell { width: calc(100% - 24px); padding-top: 16px; }
    .top { gap: 10px; margin-bottom: 14px; }
    .brand { gap: 8px; }
    .brand svg { width: 30px; height: 30px; }
    .top button { flex: none; padding-inline: 10px; }
    .hud { gap: 10px; }
    .hud, .status, .keys { padding-inline: 12px; }
    .metric { padding-left: 8px; }
    .metrics { gap: 8px 10px; }
    .ledger { grid-template-columns: minmax(0, 1fr); }
    .profile img { height: 125px; margin-right: 16px; }
    .tray { border-top: 1px solid var(--paper-line); border-left: 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    [data-enter] { animation: enter .45s ease-out both; }
    @keyframes enter { from { opacity: .6; transform: translateY(5px); } }
  }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  .dish-preview { width: 38px; height: 30px; object-fit: contain; vertical-align: middle; margin-right: 7px; }
  .ticket + .ticket, .stove + .stove { margin-top: 4px; }
  .flow {
    color: var(--paper-ink); background: var(--paper); border: 1px solid var(--paper-line);
    border-radius: 9px; color-scheme: light;
    padding: clamp(16px, 4vw, 44px); max-width: 760px; margin-inline: auto;
  }
  .flow h2 { font: bold clamp(26px, 5vw, 42px)/1.1 Cambria, serif; margin: 4px 0 12px; }
  .flow h3 { font-size: 17px; margin: 0 0 6px; }
  .flow section { margin-block: 14px; }
  .flow ul { padding-left: 22px; margin: 4px 0; }
  .flow .dish-list {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0;
    padding: 0; list-style: none;
  }
  .dish-card {
    display: flex; flex-direction: column; gap: 4px; padding: 10px;
    background: #ffefc8; border: 1px solid var(--paper-line); border-radius: 5px;
  }
  .dish-card b { line-height: 1.25; }
  .dish-card small { color: var(--paper-soft); }
  .dish-illustration { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; margin-top: auto; }
  @media (max-width: 580px) {
    .flow .dish-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (min-width: 581px) {
    .ingredient-goal ul { columns: 2; }
  }
  .flow .subtle { color: var(--paper-soft); }
  .flow .actions, .pause-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  .flow .intro-actions { margin: 0 0 14px; }
  .flow .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(130px, 100%), 1fr)); gap: 8px; }
  .fact, .upgrade { border: 1px solid var(--paper-line); background: #ffefc8; padding: 9px 11px; }
  .fact b, .upgrade b { display: block; }
  .collection-results { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
  .flow .collection-results section { margin-block: 6px; }
  @media (max-width: 540px) { .collection-results { grid-template-columns: minmax(0, 1fr); } }
  .upgrade { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .shop-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(238px, 100%), 1fr)); gap: 9px; margin-block: 14px; }
  .pause-actions { justify-content: center; }
  .result .pause-actions button { margin-top: 0; }
  #action-status, #overlay-status { color: #942f19; }
  #overlay-status:empty, #action-status:empty { display: none; }
  #goal-line { margin-top: 8px; color: var(--paper-soft); font-size: .83rem; }
  .hit-feedback { box-shadow: inset 0 0 0 4px #b93c31; position: absolute; inset: 0; pointer-events: none; }
  .hit-feedback[hidden] { display: none; }
  @media (max-width: 540px) {
    .overlay { padding: 6px; overflow: auto; place-items: safe center; }
    .result { padding: 8px; }
    .pause-actions { gap: 6px; margin-top: 8px; }
  }
</style>
<style>
  .top { flex-wrap: wrap; }
  .warnings { display: grid; gap: 4px; padding: 6px 12px; background: #1a1510; }
  .warning { padding: 6px 10px; border: 2px solid #ffd166; border-radius: 5px;
    color: #fff4dc; background: #402008; font: 700 16px/1.4 system-ui, sans-serif; }
  [data-high-contrast="true"] { --ink: #fff; --soft: #eee; --paper: #000;
    --paper-ink: #fff; --paper-soft: #eee; --paper-line: #fff; --line: #fff; --gold: #ff0; }
  [data-high-contrast="true"] .warning { color: #fff; background: #000; border-color: #ff0; }
  [data-high-contrast="true"] .warnings,
  [data-high-contrast="true"] :is(.hud, .status, .keys, .ledger, .quest, .flow, .profile, .result) {
    color: #fff; background: #000; border-color: #fff;
  }
  [data-high-contrast="true"] :is(.fact, .upgrade, .dish-card, .slot, kbd) {
    color: #fff; background: #000; border-color: #fff;
  }
  [data-high-contrast="true"] :is(.danger, .metric .danger, .ticket .danger, .spoiled, .quest .complete) { color: #ff0; }
  [data-high-contrast="true"] progress { --fill: #ff0; background: #444; }
  [data-high-contrast="true"] progress::-webkit-progress-bar { background: #444; }
  [data-high-contrast="true"] progress::-webkit-progress-value { background: #ff0; }
  [data-high-contrast="true"] progress::-moz-progress-bar { background: #ff0; }
  [data-high-contrast="true"] :focus-visible { outline-color: #fff; }
</style>
</head>
<body>
<a class="skip-link" id="skip" href="#playfield">Đến màn chơi</a>
<main class="shell">
  <header class="top" data-enter>
    <div class="brand">
      <svg viewBox="0 0 22 22" shape-rendering="crispEdges" aria-hidden="true">
        <path d="M2 0h18v2h2v18h-2v2H2v-2H0V2h2z" fill="#17281e"/>
        <path d="M2 2h18v18H2z" fill="#4a6449"/>
        <path d="M15 4h3v3h-3z" fill="#ecc46b"/>
        <path d="M10 4h1v9H6v-2h1V9h1V7h1V5h1zM12 8h1v2h1v1h1v2h-3z" fill="#ffe2a0"/>
        <path d="M4 14h15v1h-1v1h-2v1H7v-1H5v-1H4z" fill="#de9a56"/>
        <path d="M4 18h5v1H4zM12 18h6v1h-6z" fill="#b0bf79"/>
      </svg>
      <h1>Quán Ăn Chợ Nổi</h1>
    </div>
    <button id="restart" type="button">Chơi lại</button>
    <button id="pause" type="button" hidden>Tạm dừng</button>
    <button id="high-contrast" type="button" aria-pressed="false">Tương phản cao: Tắt</button>
  </header>
  <section id="flow" class="flow" aria-labelledby="flow-title" hidden>
    <div id="flow-content"></div><p role="status" id="action-status"></p>
  </section>

  <div class="game" id="game">
    <aside class="quest" id="daily-quest" aria-labelledby="quest-title" hidden>
      <h2 id="quest-title"></h2>
      <ul id="quest-items" role="list"></ul>
      <p id="quest-status" role="status" aria-live="polite"></p>
    </aside>
    <section class="playfield" id="playfield" aria-labelledby="season" tabindex="-1">
      <header class="hud">
        <div class="season">
          <span class="season-mark" id="season-mark" aria-hidden="true">·</span>
          <div><h2 id="season">Chợ Nổi</h2><p id="activity">Đang kết nối</p></div>
        </div>
        <div class="metrics" id="metrics"></div>
      </header>
      <div id="warnings" class="warnings" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <div class="scene" data-visual>
        <canvas id="world" aria-label="Cảnh chơi của Bà Út">Cảnh chơi cần trình duyệt hỗ trợ Canvas.</canvas>
        <span class="hit-feedback" id="hit-feedback" aria-hidden="true" hidden></span>
        <div class="overlay" id="overlay">
          <div class="result">
            <h2 id="result-title" role="status">Đang tải…</h2>
            <p id="result-text">Đang lấy trạng thái buổi chơi.</p>
            <div class="pause-actions" id="pause-actions" hidden>
              <button type="button" data-action="resume">Tiếp tục</button>
              <button type="button" data-action="menu">Về menu</button>
            </div>
            <p id="overlay-status" role="status"></p>
            <button id="result-restart" type="button" hidden>Chơi lại</button>
          </div>
        </div>
      </div>
      <div class="status">
        <span id="hint"></span><span id="notice" role="status"></span>
      </div>
      <div class="keys" aria-label="Điều khiển">
        <span><kbd>WASD</kbd><kbd>↑↓←→</kbd> Di chuyển</span>
        <span><kbd>E</kbd> <span id="interact-key">Tương tác</span></span>
        <span id="catch-key" hidden><kbd>Space</kbd> Bắt cá</span>
        <span id="restart-key"><kbd>R</kbd> Chơi lại</span>
        <span id="sprint-key" hidden><kbd>Shift</kbd> Chạy nhanh</span>
        <span id="pause-key" hidden><kbd>P</kbd><kbd>Esc</kbd> Tạm dừng</span>
      </div>
    </section>
    <aside class="ledger" aria-labelledby="character">
      <div class="profile">
        <h2 id="character">Bà Út</h2>
        <img id="portrait" src="art/ba-ut.webp" width="300" height="520" alt="">
      </div>
      <div class="tray">
        <div id="basket" hidden>
          <h2 id="hold-title">Giỏ</h2><div class="slots" id="slots" aria-hidden="true"></div>
          <div id="hold-summary" hidden></div>
          <p id="goal-line" hidden></p>
        </div>
        <div class="stock" id="stock" aria-label="Kho khả dụng" hidden></div>
        <div class="orders" id="orders" hidden>
          <div id="tickets"></div><div id="kitchen"></div><p id="hand"></p>
        </div>
        <div class="extras" id="extras" aria-label="Dòng lũ và khách đặt trước" hidden></div>
      </div>
    </aside>
  </div>
</main>
<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("world");
const ctx = canvas.getContext("2d");
let paintPending = true;
const renderBenchmark = location.search === "?benchmark=render";
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const labels = [];
const itemNames = {

async function request(path, body) {

    `Không thể ${operation} (${error.message.startsWith("HTTP") ? error.message : "dữ liệu phản hồi không hợp lệ"}).`;
  held.clear();

  const dy = Number(keys.includes("down")) - Number(keys.includes("up"));

  const body = JSON.stringify(force ? { ...neutral, ...sprint } : {
    move: [dx, snap?.mode === "quan" ? -dy : dy], interact: held.has("e"), catch: held.has(" "), ...sprint

  lastInput = body;

  writes = writes.then(async () => {
    try {

function acceptState(state) {

  if (nextDay && !stages.includes(nextDay.screen)) throw new Error("Màn chơi không hợp lệ");
  const playing = !nextDay || ["gather", "quan"].includes(nextDay.screen);
  const nextSnap = !nextDay ? state : playing && record(nextDay.snapshot) ?
    { ...nextDay.snapshot, mode: nextDay.screen, events: nextDay.events, error: nextDay.error } : null;
  const changed = day?.screen !== nextDay?.screen || day?.day !== nextDay?.day ||
    snap?.mode !== nextSnap?.mode || (num(snap?.tick) && num(nextSnap?.tick) && nextSnap.tick < snap.tick);
  if (changed) {
    cameraSnap = true;
    resetMessages();
    actionError = "";
    held.clear();
    lastInput = "";

    walkFacing = 1;
    if (nextSnap) needsRelease = true;

async function poll() {

  if (!restartPending && !actionPending) {
    try {
      const state = await request("/state");
      if (generation === epoch && !restartPending && !actionPending) acceptState(state);
    } catch (error) {
      if (generation === epoch) {
        const releaseNow = canPlay();
        reportFailure(error, "tải buổi chơi");
        if (releaseNow) sendInput(true);
      }
    }
  }
  setTimeout(poll, 33);

    if (!onScreen(x)) continue;
    const t = reducedMotion.matches ? 0 : now / 1000;
    const bank = Math.sin(heading) * facing * -.34 + Math.sin(t * 7 + anim.phase) * .05;
    const flip = Math.sign(anim.facing) * Math.max(.18, Math.abs(anim.facing));
    drawSprite(image, x, y + Math.sin(t * 2.1 + anim.phase) * 1.4, size * (fish.kind === "ca_loc" ? 1.05 : .72), bank, flip);
  }
  for (const id of fishAnim.keys()) if (!seen.has(id)) fishAnim.delete(id);
  for (const monster of list(snap.monsters)) {
    if (!position(monster.pos)) continue;
    const [x, y] = at(visualPos(monster, "monsters"));
    if (!onScreen(x)) continue;
    const heading = num(monster.heading_deg) ? monster.heading_deg * Math.PI / 180 : Math.PI;
    const facing = Math.cos(heading) < 0 ? 1 : -1;
    drawSprite(crocodileArt, x, y, size * 1.7, Math.sin(heading) * facing * -.34, facing);
    const state = known({ chase: "Đang đuổi", patrol: "Tuần tra", recoil: "Lùi lại" }, monster.state);
    label(state ? "Cá sấu · " + state : "Cá sấu", x, y + size * .22 + 12);
  }
  const player = snap.player;
  if (!position(player?.pos)) return;
  const shown = blendPosition(player.pos, previousPose?.player?.pos);
  const [x, y] = at(shown);
  const heading = num(player.heading_deg) ? player.heading_deg * Math.PI / 180 : 0;
  const facing = Math.cos(heading) < 0 ? -1 : 1;
  const standing = player.at_surface !== false && near(player.pos, snap.meta.dock_pos, snap.meta.dock_radius);
  drawCatchRing(at, player, shown);
  if (standing) {
    drawSprite(protagonist, x, y, size, 0, facing, .8);
    label("Bà Út", x, y - size * .8 - 10, true);
  } else {
    // The swimming artwork faces left at rest.
    const tilt = player.at_surface === false ? Math.atan2(Math.sin(heading) * facing, Math.abs(Math.cos(heading))) : 0;
    swimAtlas ??= loadSprite("ba-ut-nhip-boi");
    if (swimAtlas.naturalWidth) {
      // The glide pose is followed by five strokes, in row order.
      const pose = motionFrame("gather");
      const width = swimAtlas.naturalWidth / 3, height = swimAtlas.naturalHeight / 2;
      drawSprite(swimAtlas, x, y, size, tilt, -facing, .5,
        [pose % 3 * width, Math.floor(pose / 3) * height, width, height]);
    } else if (swimmer.naturalWidth) drawSprite(swimmer, x, y, size, tilt, -facing);
    else drawSprite(protagonist, x, y, size, facing * .53, facing);
    label("Bà Út", x, y + size * .45 + 11, true);
  }
  drawSplashes(at, size, now);
  drawDockGuide(at, w, h);
}
// Extension "reservations": biển đặt trước trên bàn (đang giữ bàn / sắp đến / đang chờ món).
function drawReservation(r, x, y, size) {
  if (!r) return;
  const phaseTick = num(snap.phase_tick) ? snap.phase_tick : snap.tick;
  const left = num(phaseTick) && num(r.arrival_tick) ? Math.ceil(Math.max(0, r.arrival_tick - phaseTick) / tickRate()) : null;
  if (r.state === "scheduled") {
    if (left !== null && left <= 60) label(`${r.id} hẹn ${left}s`, x, y + 36);
    return;
  }
  const holding = r.state === "holding";
  const text = holding ? `ĐẶT TRƯỚC ${r.id}` : `★ ${r.id}`;
  ctx.save();
  ctx.font = "800 12px system-ui, sans-serif";
  const width = ctx.measureText(text).width + 16, height = 20;
  const top = y - size * .55 - height;
  ctx.fillStyle = holding ? "#f4c542" : "#ffe08a";
  ctx.strokeStyle = "#5b3b0c";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(x - width / 2, top, width, height, 5);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#3a2606";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, top + height / 2);
  ctx.restore();
  const sub = holding ? `${dishName(r.dish_id)} · đến sau ${left ?? "—"}s` : `Chờ ${dishName(r.dish_id)}` +
    (num(snap.meta?.reservations?.price_multiplier) ? ` · giá ×${number(snap.meta.reservations.price_multiplier)}` : "");
  label(sub, x, y + 36);
}

let quanFixtures, walkAtlas;
function drawQuan(at, size, w) {
  quanFixtures ??= {
    B1: loadSprite("bep-mot"), B2: loadSprite("bep-hai"),
    T1: loadSprite("ban-mot"), T2: loadSprite("ban-hai"),
    T3: loadSprite("ban-ba"), T4: loadSprite("ban-bon")
  };
  for (const stove of list(snap.stoves)) {
    if (!position(stove.pos)) continue;
    const [x, y] = at(stove.pos);
    const sprite = known(quanFixtures, stove.id);
    if (sprite) drawSprite(sprite, x, y, w * .116, 0, 1, 1);
    const active = stove.state === "cooking" || stove.state === "ready";
    pin(x, y, stove.id ?? "Bếp", active);
    // Bàn của món đang nấu: dish.order_id -> customer.id -> table_id (không suy từ số bếp).
    if (stove.dish && active) {
      const table = tableForOrder(stove.dish.order_id) ?? "?";
      label(stove.state === "ready" ? `${table} · Món chín` :
        `${table} · ${num(stove.cook_ticks_left) ? countdown(stove.cook_ticks_left) : "Đang nấu"}`, x, y + 36, stove.state === "ready");
    }
  }
  const customers = list(snap.customers);
  const reservations = list(snap.reservations);
  for (const table of list(snap.tables)) {
    if (!position(table.pos)) continue;
    const [x, y] = at(table.pos);
    const sprite = known(quanFixtures, table.id);
    if (sprite) drawSprite(sprite, x, y, w * .105, 0, 1, 1);
    const customer = customers.find(c => c.table_id === table.id);
    if (customer) {
      const offset = x > w / 2 ? size * -.34 : size * .34;
      const id = Number(String(customer.id).match(/\d+$/)?.[0] ?? 0);
      ellipse(x + offset, y + 4, size * .19, 5, "#211d17a0");
      drawSprite(guests[id % guests.length], x + offset, y + 4, size * .74, 0, 1, 1);
      // Cùng điểm neo với sprite khách (đáy tại y + 4, cao tối đa size * .74).
      drawCustomerBar(customer, x + offset, y + 4 - size * .74 - 6, size);
    }
    pin(x, y, table.id ?? "Bàn", Boolean(customer));
    drawReservation(reservations.find(r => r.table_id === table.id && !["served", "failed"].includes(r.state)), x, y, size);
  }
  if (!position(snap.player?.pos)) return;
  const [x, y] = at(blendPosition(snap.player.pos, previousPose?.player?.pos));
  ellipse(x, y, size * .25, size * .09, "#211b14a8");
  ellipse(x, y, size * .19, size * .06, "#f7cf86");
  walkAtlas ??= loadSprite("ba-ut-di-bo");
  if (walkAtlas.naturalWidth) {
    // Rows face front, back and right. Column zero is the matching idle pose.
    const width = walkAtlas.naturalWidth / 5, height = walkAtlas.naturalHeight / 3;
    const column = motionFrame("quan");
    drawSprite(walkAtlas, x, y, size, 0, walkFacing, 1, [column * width, walkRow * height, width, height]);
  } else {
    drawSprite(protagonist, x, y, size, 0, 1, 1);
  }
  if (snap.hand) {
    ellipse(x + size * .33, y - size * .38, size * .14, size * .09, "#fff0d5");
    ellipse(x + size * .33, y - size * .39, size * .09, size * .05, "#ac6940");
  }
  const nameY = w < 500 ? y + 13 : y - size - 11;
  label("Bà Út", x, nameY, true);
  drawServingBadge(x, w < 500 ? y - size - 14 : nameY - 26);
}

// FEATURE 01 — thanh trạng thái trên đầu khách. Chỉ đọc timer của simulation, không tự đếm.
const CUSTOMER_BAR_DANGER_RATIO = 0.2;  // còn ≤ 20% kiên nhẫn ban đầu -> đỏ "Sắp bỏ đi"
function customerStatus(c) {
  if (c.state === "eating") {
    const max = num(snap.meta?.eat_s) ? snap.meta.eat_s * tickRate() : null;
    return num(c.eat_ticks_left) && max > 0 ? { kind: "eat", ratio: c.eat_ticks_left / max } : null;
  }
  if (c.state !== "waiting") return null;
  const max = num(c.patience_max_ticks) ? c.patience_max_ticks : num(snap.meta?.patience_s) ? snap.meta.patience_s * tickRate() : null;
  if (!num(c.patience_ticks_left) || !(max > 0)) return null;
  const ratio = c.patience_ticks_left / max;
  return { kind: ratio <= CUSTOMER_BAR_DANGER_RATIO ? "danger" : "wait", ratio };
}
const customerBarStyle = {
  wait: { fill: "#5cc46a", text: "Đang chờ" },
  eat: { fill: "#f2c335", text: "Đang ăn" },
  danger: { fill: "#e5483b", text: "⚠ Sắp bỏ đi" }
};
const customerBarContrastStyle = {
  wait: { fill: "#00ff00", text: "Đang chờ" },
  eat: { fill: "#ffff00", text: "Đang ăn" },
  danger: { fill: "#ff6b6b", text: "⚠ Sắp bỏ đi" }
};
function drawCustomerBar(c, cx, bottom, size) {
  const status = customerStatus(c);
  if (!status) return;
  const style = (highContrast ? customerBarContrastStyle : customerBarStyle)[status.kind];
  const width = Math.max(40, Math.min(55, size * .72)), height = 6;
  const left = cx - width / 2, top = bottom - height;
  const ratio = Math.max(0, Math.min(1, status.ratio));
  // Nhịp chậm ~1,2 s cho trạng thái đỏ; tắt khi người dùng giảm chuyển động hoặc đang tạm dừng.
  const pulse = status.kind === "danger" && !highContrast && !reducedMotion.matches && !day?.paused ?
    .65 + .35 * Math.abs(Math.sin(performance.now() / 380)) : 1;
  ctx.save();
  ctx.fillStyle = highContrast ? "#000" : "#1a1510d9";
  ctx.beginPath();
  ctx.roundRect(left - 2, top - 2, width + 4, height + 4, 4);
  ctx.fill();
  if (highContrast) {
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.globalAlpha = pulse;
  ctx.fillStyle = style.fill;
  if (ratio > 0) {
    ctx.beginPath();
    ctx.roundRect(left, top, Math.max(2, width * ratio), height, 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.font = "700 10px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  ctx.lineWidth = 3;
  ctx.strokeStyle = highContrast ? "#000" : "#1a1510e6";
  ctx.strokeText(style.text, cx, top - 3);
  ctx.fillStyle = highContrast ? "#fff" : status.kind === "danger" ? "#ffd2c9" : "#fff4dc";
  ctx.fillText(style.text, cx, top - 3);
  ctx.restore();
}

// FEATURE 02 — bàn cần mang món tới: hand.order_id -> customer.id -> table_id.
function tableForOrder(orderId) {
  if (typeof orderId !== "string") return null;
  return list(snap?.customers).find(c => c.id === orderId)?.table_id ?? null;
}
let badgeOrder = null, badgeShownAt = 0;
function drawServingBadge(x, y) {
  const orderId = snap.hand?.order_id ?? null;
  if (orderId !== badgeOrder) {
    badgeOrder = orderId;
    badgeShownAt = performance.now();
  }
  if (!orderId) return;
  const table = tableForOrder(orderId);
  const text = table ? `🍽 MANG TỚI ${table}` : "Chưa rõ bàn";
  const grow = reducedMotion.matches ? 1 : Math.min(1, (performance.now() - badgeShownAt) / 180);
  ctx.save();
  ctx.translate(x, Math.max(14, y));  // không bị cắt ở mép trên Canvas
  ctx.scale(.7 + .3 * grow, .7 + .3 * grow);
  ctx.font = "800 13px system-ui, sans-serif";
  const width = ctx.measureText(text).width + 18, height = 22;
  ctx.fillStyle = table ? "#0f6b73" : "#7a3b2e";
  ctx.strokeStyle = "#e9fbff";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(-width / 2, -height / 2, width, height, 6);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 0, 1);
  ctx.restore();
  if (!table && !unmatchedOrders.has(orderId)) {
    unmatchedOrders.add(orderId);
    console.warn("Món trên tay không khớp đơn nào", orderId);  // ghi một lần để kiểm tra backend
  }
}
const unmatchedOrders = new Set();

function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  const dpr = window.devicePixelRatio || 1;
  const pixelWidth = Math.round(w * dpr), pixelHeight = Math.round(h * dpr);
  if (canvas.width !== pixelWidth) canvas.width = pixelWidth;
  if (canvas.height !== pixelHeight) canvas.height = pixelHeight;
  ctx.setTransform(pixelWidth / w, 0, 0, pixelHeight / h, 0, 0);
  ctx.clearRect(0, 0, w, h);
  labels.length = 0;
  const gather = snap?.mode === "gather";
  const xb = snap?.meta?.bounds?.x;
  if (gather && position(xb) && position(snap.player?.pos)) {
    const now = performance.now();
    updateCamera(now, xb, blendPosition(snap.player.pos, previousPose?.player?.pos)[0]);
    if (gatherWorldWidth(xb) > 1.001) drawGatherBackground(w, h, gatherWorldWidth(xb));
  }
  const at = project(snap?.meta?.bounds, gather, w, h);
  if (!at) return;
  const size = Math.min(76, Math.max(33, w * .085));
  if (gather) drawGather(at, size);
  else drawQuan(at, size, w);
  drawLabels(w, h);
  if (renderBenchmark && gather) window.onBenchmarkFrame?.(performance.now());
}


function invalidate() { paintPending = true; }
function frame(now) {
  const active = snap && !day?.paused && !snap.finished && !snap.error && !problem && !document.hidden;
  const playingDay = day && active;
  const blend = active && (playingDay || motionDelta > 0) && previousPose && !reducedMotion.matches ?
    Math.max(0, Math.min(1, (now - poseAt) / poseMs)) : 1;
  if (paintPending || playingDay || blend !== visualBlend || (renderBenchmark && active)) {
    paintPending = false;
    visualBlend = blend;
    $("hit-feedback").hidden = !playingDay || reducedMotion.matches || now >= hitUntil;
    draw();
  }
  requestAnimationFrame(frame);
}
new ResizeObserver(invalidate).observe(canvas);
addEventListener("resize", invalidate);
reducedMotion.addEventListener("change", invalidate);
requestAnimationFrame(frame);
try { applyContrast(localStorage.getItem("chonoi.highContrast") === "true"); } catch { applyContrast(false); }
poll();
</script>
